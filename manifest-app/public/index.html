<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Priority Global — Manifiestos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tablericons/2.47.0/iconfont/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0eff0;--surface:#fff;--surface2:#f7f6f7;--surface3:#efefef;
  --border:#e0dede;--border2:#ccc;
  --text:#1a1a18;--text2:#5a5a5a;--text3:#999;
  --accent:#1a5ea8;--accent-bg:#e8f1fb;--accent-hover:#144d8e;
  --success:#0a6648;--success-bg:#e0f4ec;
  --warn:#7a4800;--warn-bg:#fdf0da;
  --danger:#a02020;--danger-bg:#fceaea;
  --purple:#5a2d9a;--purple-bg:#f0eafa;
  --radius:7px;--radius2:11px;
}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;background:var(--surface);border-bottom:2px solid var(--border);flex-shrink:0}
.topbar-logo{font-weight:700;font-size:14px;color:var(--accent);letter-spacing:-.3px}
.topbar-logo span{color:var(--text2);font-weight:400;font-size:12px;margin-left:4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.accent:hover{background:var(--accent-hover)}
.btn.success{background:var(--success);color:#fff;border-color:transparent}
.btn.success:hover{background:#085438}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.purple{background:var(--purple);color:#fff;border-color:transparent}
.btn.purple:hover{background:#481d80}
.btn.sm{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── BRIDGE STATUS ── */
#bridge-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border)}
#bridge-pill.online{background:var(--success-bg);color:var(--success);border-color:#9fd8c0}
#bridge-pill.offline{background:var(--danger-bg);color:var(--danger);border-color:#f0b0b0}
.bridge-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ── LAYOUT ── */
.app-body{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:270px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-search{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:5px;align-items:center}
.sidebar-search input{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;background:var(--surface2)}
.sidebar-search input:focus{outline:none;border-color:var(--accent)}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-tab{flex:1;padding:6px 4px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.sidebar-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-bg)}
.sidebar-tab:hover:not(.active){color:var(--text);background:var(--surface2)}
.bl-search-results{background:var(--surface2);border-bottom:1px solid var(--border)}
.bl-search-item{padding:6px 10px 6px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.bl-search-item:hover{background:#e8edf5}
.bl-search-item .bsi-bl{font-size:11px;font-weight:600;color:var(--accent)}
.bl-search-item .bsi-meta{font-size:10px;color:var(--text3);margin-top:1px}
/* Contenedores múltiples chips */
.cont-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cont-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--accent-bg);color:var(--accent);border:1px solid #aac8f0;font-family:monospace}
.manifest-list{flex:1;overflow-y:auto}
.manifest-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;user-select:none}
.manifest-item:hover{background:var(--surface2)}
.manifest-item.active{background:var(--accent-bg);border-left:3px solid var(--accent)}
.manifest-item .mi-title{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;min-width:0}
.manifest-item .mi-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* BL list dentro del manifiesto */
.bl-list{background:var(--surface2);border-bottom:1px solid var(--border)}
.bl-list-item{padding:5px 10px 5px 24px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);transition:background .1s}
.bl-list-item:hover{background:#e8edf5}
.bl-list-item.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.bl-list-item.validated{color:var(--success);font-weight:700}
.bl-list-item.siscommate{color:var(--purple)}
.bl-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.bl-list-item.active .bl-dot{background:var(--accent)}
.bl-list-item.validated .bl-dot{background:var(--success)}

/* Sidebar item actions */
.manifest-item{position:relative}
.mi-actions{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.mi-btn{display:inline-flex;align-items:center;justify-content:center;gap:3px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text2);transition:background .12s,color .12s,border-color .12s;padding:0 5px;font-size:12px;flex-shrink:0;white-space:nowrap}
.mi-btn i{font-size:13px;line-height:1}
.mi-btn:hover{background:var(--surface3);border-color:var(--border2);color:var(--text)}
.mi-btn.danger{color:var(--danger);background:var(--danger-bg);border-color:#f0b0b0}
.mi-btn.danger:hover{background:#fce0e0;border-color:var(--danger)}
.mi-btn.toggle-btn{width:26px;height:26px;padding:0;font-size:13px;border-color:var(--border);transition:background .12s,color .12s,border-color .12s}
.mi-btn.toggle-btn.open{color:var(--accent);background:var(--accent-bg);border-color:#aac8f0}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-toolbar{display:flex;align-items:center;gap:7px;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.main-toolbar .voy-label{font-size:12px;font-weight:600;color:var(--text2)}

/* ── EDITOR ── */
.editor{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3)}
.empty-state i{font-size:48px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--radius2);padding:28px;text-align:center;color:var(--text3);cursor:pointer;transition:all .2s;max-width:480px}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;flex-shrink:0}
.card-hdr{padding:8px 13px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text2)}
.card-hdr i{font-size:15px}
.card-body{padding:14px 16px}
.card.warn-card{border-color:#e6b86a;background:#fffdf5}
.card.warn-card .card-hdr{background:var(--warn-bg);color:var(--warn)}
.card.purple-card{border-color:#c4a9e8}
.card.purple-card .card-hdr{background:var(--purple-bg);color:var(--purple)}

/* ── FORM GRID ── */
.fg{display:grid;gap:10px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fg4{grid-template-columns:1fr 1fr 1fr 1fr}
.fg>.field,.fg>div{min-width:0}
.fspan{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
.field input,.field select,.field textarea{
  padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);font-size:13px;color:var(--text);font-family:inherit;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,94,168,.12)}
.field textarea{resize:vertical;min-height:46px}
.field.f-warn input,.field.f-warn select{border-color:#e6a840;background:#fffcf2}
.field.f-ok input,.field.f-ok select{border-color:#5ab88a;background:#f5fef8}
.field.f-info input{border-color:#7ab0e0;background:#f0f7ff}
.hint{font-size:10px;color:var(--text3);margin-top:1px}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.tag.ship{background:var(--success-bg);color:var(--success)}
.tag.cons{background:var(--accent-bg);color:var(--accent)}
.tag.ntf{background:var(--warn-bg);color:var(--warn)}

/* ── BADGE ── */
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600}
.badge.pend{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.exp{background:var(--accent-bg);color:var(--accent)}
.badge.sis{background:var(--purple-bg);color:var(--purple)}

/* ── AUTOCOMPLETE ── */
.ac-wrap{position:relative}
.ac-drop{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);z-index:9999;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.15);display:none;min-width:200px}
.ac-item{padding:6px 9px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac-item:hover,.ac-item.focused{background:var(--accent-bg)}
.ac-item:last-child{border-bottom:none}
.ac-name{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-code{font-size:10px;color:var(--text3);white-space:nowrap;font-family:monospace}
.ac-badge{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--warn-bg);color:var(--warn);font-weight:600;white-space:nowrap}

/* ── SUGGEST BOX ── */
.suggest-box{background:var(--warn-bg);border:1px solid #e6b86a;border-radius:var(--radius);padding:7px 10px;margin-top:4px;display:flex;align-items:flex-start;gap:8px}
.suggest-box i{color:var(--warn);font-size:16px;flex-shrink:0;margin-top:1px}
.suggest-content{flex:1;font-size:11px}
.suggest-title{font-weight:600;color:var(--warn);margin-bottom:4px}
.suggest-items{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.suggest-chip{padding:3px 8px;border:1px solid #e6b86a;border-radius:20px;cursor:pointer;font-size:11px;background:var(--surface);transition:all .1s;display:flex;gap:4px;align-items:center}
.suggest-chip:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
.suggest-chip .sc-code{font-family:monospace;font-size:10px;font-weight:600}

/* ── TXT PREVIEW ── */
.txt-pre{background:#1a1a1a;color:#a8e6a0;font-family:'Consolas','Courier New',monospace;font-size:11px;padding:12px;border-radius:var(--radius);white-space:pre;overflow-x:auto;line-height:1.7}
.txt-ruler{background:#2a2a2a;color:#666;font-family:monospace;font-size:10px;padding:2px 12px;border-radius:var(--radius) var(--radius) 0 0}

/* ── STATUSBAR ── */
.statusbar{padding:4px 14px;font-size:11px;color:var(--text3);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-shrink:0;gap:10px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius2);padding:24px;min-width:380px;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,.22)}
.modal h3{font-size:15px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ── SPINNER ── */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;right:20px;padding:9px 16px;border-radius:var(--radius);font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;max-width:340px}
#toast.ok{background:#1a3d1a;color:#b8f0b8}
#toast.err{background:#3d1a1a;color:#f0b8b8}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">Priority Global <span>Manifiestos DGA → Hacienda PR</span></div>
  <div id="bridge-pill" class="offline" title="Estado de SiscommateBridge">
    <span class="bridge-dot"></span><span id="bridge-txt">Bridge offline</span>
  </div>
  <div class="spacer"></div>
  <div id="stats-top" style="font-size:11px;color:var(--text2)"></div>
  <a href="/admin.html" target="_blank" class="btn" title="Configuración del sistema">&#9881; Admin</a>
  <button class="btn" onclick="openUpload()"><i class="ti ti-upload"></i> Cargar XML/PDF</button>
  <input type="file" id="xml-input" accept=".xml,.pdf" style="display:none" onchange="uploadXml(this)"/>
</div>

<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" id="tab-active" onclick="switchTab('active')">En curso</div>
      <div class="sidebar-tab" id="tab-completed" onclick="switchTab('completed')">Completados</div>
    </div>
    </div>

    <div class="statusbar">
      <span id="status-msg">Listo</span>
      <span id="status-right"></span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════════════════
let allManifests       = [];
let currentManifestId  = null;
let currentManifestData= null;
let currentBL          = null;
let catalogCarriers    = [];
let catalogPorts       = [];
let catalogVessels     = [];
let saveTimer          = null;
const expandedSet      = new Set(); // IDs de manifiestos con BL-list expandido

// ═══════════════════════════════════════════════════════════════
// UTILIDADES
// ═══════════════════════════════════════════════════════════════
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg, type='ok'){
  const el=document.getElementById('toast');
  el.textContent=(type==='ok'?'✓  ':'⚠  ')+msg;
  el.className='show '+(type==='ok'?'ok':'err');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
function setStatus(msg,right=''){
  document.getElementById('status-msg').textContent=msg;
  document.getElementById('status-right').textContent=right;
}
async function api(path, opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

// ═══════════════════════════════════════════════════════════════
// BRIDGE STATUS
// ═══════════════════════════════════════════════════════════════
async function checkBridge(){
  try{
    const d=await api('/api/bridge/status');
    const pill=document.getElementById('bridge-pill');
    const txt=document.getElementById('bridge-txt');
    if(d.online){
      pill.className='online';
      txt.textContent='Bridge activo';
    } else { throw new Error('offline'); }
  } catch(e){
    const pill=document.getElementById('bridge-pill');
    pill.className='offline';
    document.getElementById('bridge-txt').textContent='Bridge offline';
  }
}
setInterval(checkBridge,30000);
checkBridge();

// ═══════════════════════════════════════════════════════════════
// CATÁLOGOS (carga al inicio)
// ═══════════════════════════════════════════════════════════════
async function loadCatalogs(){
  try{
    [catalogCarriers, catalogPorts, catalogVessels] = await Promise.all([
      api('/api/catalogs/carriers'),
      api('/api/catalogs/ports'),
      api('/api/catalogs/vessels'),
    ]);
  } catch(e){ console.warn('Error cargando catálogos', e); }
}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
async function loadStats(){
  try{
    const s=await api('/api/stats');
    document.getElementById('stats-top').innerHTML=
      `<b>${s.manifests}</b> viajes &nbsp;·&nbsp; <b>${s.bls}</b> B/L &nbsp;·&nbsp; `+
      `<span style="color:var(--warn)"><b>${s.pending}</b> pendientes</span>`;
  } catch(e){}
}

// ═══════════════════════════════════════════════════════════════
// MANIFIESTOS — SIDEBAR
// ═══════════════════════════════════════════════════════════════
async function loadManifests(){
  try{
    allManifests=await api('/api/manifests');
    renderManifestList(filteredByTab(allManifests));
    loadStats();
  } catch(e){ setStatus('Error conectando con el servidor: '+e.message); }
}

function renderManifestList(list){
  const el=document.getElementById('manifest-list');
  if(!list.length){
    el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">Sin manifiestos</div>';
    return;
  }
  el.innerHTML=list.map(m=>{
    const isActive  = currentManifestId===m.id;
    const isOpen    = expandedSet.has(m.id);
    const badgeCls  = m.status==='siscommate'?'sis':m.status==='exportado'?'exp':m.status==='validado'?'ok':'pend';

    // Lista de BLs — solo si está expandido y tenemos datos
    let blHtml='';
    if(isOpen && isActive && currentManifestData){
      blHtml=`<div class="bl-list">`+
        currentManifestData.bls.map(bl=>{
          const cls=currentBL&&currentBL.id===bl.id?'active':bl.status==='validado'?'validated':'';
          return `<div class="bl-list-item ${cls}" onclick="selectBLById(${bl.id})">
            <span class="bl-dot"></span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(bl.bl_no)}</span>
            ${bl.status==='validado'?'<i class="ti ti-check" style="font-size:11px;color:var(--success)"></i>':''}
            <button class="mi-btn danger sm" style="padding:1px 5px;height:20px;font-size:10px;margin-left:4px" title="Eliminar B/L ${esc(bl.bl_no)}"
              onclick="event.stopPropagation();confirmDeleteBL(${bl.id},'${esc(bl.bl_no)}')">
              <i class="ti ti-trash" style="font-size:11px"></i>
            </button>
          </div>`;
        }).join('')+
      `</div>`;
    }

    return `
    <div>
      <div class="manifest-item ${isActive?'active':''}">
        <div class="mi-title">
          <button class="mi-btn toggle-btn ${isOpen?'open':''}" title="${isOpen?'Colapsar':'Expandir'} lista de B/L"
            onclick="toggleExpand(${m.id})">
            ${isOpen ? '▼' : '▶'}
          </button>
          <span style="flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            onclick="selectManifest(${m.id})">Viaje ${esc(m.voyage_no)}</span>
          <span class="badge ${badgeCls}">${m.status}</span>
          <button class="mi-btn danger" title="Eliminar manifiesto"
            onclick="event.stopPropagation();confirmDeleteManifest(${m.id},'${esc(m.voyage_no)}')">
            <i class="ti ti-trash"></i> Eliminar
          </button>
        </div>
        <div class="mi-sub" style="padding-left:26px;cursor:pointer" onclick="selectManifest(${m.id})">
          ${esc(m.vessel_name||m.vessel_code||'')} &nbsp;·&nbsp; ${m.bl_count} B/L
        </div>
        <div class="mi-sub" style="padding-left:26px">${(m.arrival_date||'').substring(0,10)}</div>
      </div>
      ${blHtml}
    </div>`;
  }).join('');
}

async function toggleExpand(id){
  if(expandedSet.has(id)){
    expandedSet.delete(id);
    renderManifestList(filteredByTab(allManifests));
  } else {
    expandedSet.add(id);
    if(currentManifestId !== id){
      await selectManifest(id);
    } else {
      renderManifestList(filteredByTab(allManifests));
    }
  }
}

// ─── TABS: En curso / Completados ───────────────────────────────────────────
let currentTab = 'active'; // 'active' | 'completed'

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-active').className    = 'sidebar-tab' + (tab==='active'?' active':'');
  document.getElementById('tab-completed').className = 'sidebar-tab' + (tab==='completed'?' active':'');
  document.getElementById('sidebar-search-input').value = '';
  document.getElementById('bl-search-results').style.display = 'none';
  renderManifestList(filteredByTab(allManifests));
}

function filteredByTab(list){
  if(currentTab==='completed')
    return list.filter(m=>m.status==='siscommate'||m.status==='exportado');
  return list.filter(m=>m.status!=='siscommate'&&m.status!=='exportado');
}



let searchTimer;
async function onSidebarSearch(q){
  clearTimeout(searchTimer);
  const blPanel = document.getElementById('bl-search-results');
  if(!q || q.length < 2){
    blPanel.style.display='none';
    renderManifestList(filteredByTab(allManifests));
    return;
  }
  searchTimer = setTimeout(async()=>{
    try{
      const data = await api(`/api/search?q=${encodeURIComponent(q)}`);
      // Manifiestos filtrados
      const ql = q.toLowerCase();
      const matchedManifests = allManifests.filter(m=>
        (m.voyage_no||'').toLowerCase().includes(ql)||
        (m.filename||'').toLowerCase().includes(ql)||
        (m.vessel_name||'').toLowerCase().includes(ql)||
        (m.manifest_no||'').toLowerCase().includes(ql)
      );
      renderManifestList(matchedManifests);
      // Resultados de BL
      if(data.bls && data.bls.length){
        blPanel.style.display='block';
        blPanel.innerHTML=
          `<div style="padding:4px 10px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">B/L encontrados</div>`+
          data.bls.map(bl=>`
            <div class="bl-search-item" onclick="jumpToBL(${bl.manifest_id},${bl.id})">
              <div class="bsi-bl">${esc(bl.bl_no)} <span style="font-weight:400;color:var(--text2)">${esc(bl.consignee_name||'')}</span></div>
              <div class="bsi-meta">Viaje ${esc(bl.voyage_no)} &nbsp;·&nbsp; ${(bl.arrival_date||'').substring(0,10)}</div>
            </div>`).join('');
      } else {
        blPanel.style.display='none';
      }
    }catch(e){}
  },250);
}

async function jumpToBL(manifestId, blId){
  document.getElementById('sidebar-search-input').value='';
  document.getElementById('bl-search-results').style.display='none';
  if(currentManifestId !== manifestId) await selectManifest(manifestId);
  selectBLById(blId);
}

function filterManifests(q){
  renderManifestList(allManifests.filter(m=>
    m.voyage_no.toLowerCase().includes(q.toLowerCase())||
    (m.filename||'').toLowerCase().includes(q.toLowerCase())||
    (m.vessel_name||'').toLowerCase().includes(q.toLowerCase())
  ));
}

async function selectManifest(id){
  currentManifestId=id;
  expandedSet.add(id); // auto-expandir al seleccionar
  try{
    currentManifestData=await api(`/api/manifests/${id}`);
    const m=currentManifestData.manifest;
    // Toolbar
    document.getElementById('main-toolbar').style.display='flex';
    document.getElementById('toolbar-voyage').textContent=`Viaje ${m.voyage_no}`;
    document.getElementById('toolbar-vessel').textContent=m.vessel_name||'';
    // Re-render sidebar con BLs
    renderManifestList(filteredByTab(allManifests));
    // Seleccionar primer BL
    if(currentManifestData.bls.length){
      selectBL(currentManifestData.bls[0]);
    } else {
      document.getElementById('editor').innerHTML='<div class="empty-state"><i class="ti ti-packages"></i><p>Este manifiesto no tiene B/L</p></div>';
    }
    setStatus(`Manifiesto ${m.voyage_no} — ${currentManifestData.bls.length} B/L cargados`);
  } catch(e){ toast('Error cargando manifiesto','err'); }
}

function selectBLById(id){
  if(!currentManifestData) return;
  const bl=currentManifestData.bls.find(b=>b.id===id);
  if(bl) selectBL(bl);
}

function selectBL(bl){
  currentBL=bl;
  document.getElementById('btn-preview').disabled=false;
  renderManifestList(filteredByTab(allManifests));
  renderEditor(bl);
}

// ═══════════════════════════════════════════════════════════════
// CARGO ITEMS — items de carga múltiples por B/L
// ═══════════════════════════════════════════════════════════════
let currentCargoItems = [];

async function loadCargoItems(blId) {
  try {
    currentCargoItems = await api(`/api/bl/${blId}/cargo-items`);
    renderCargoItems();
  } catch(e) { currentCargoItems = []; renderCargoItems(); }
}

function blContainers() {
  if (!currentManifestData || !currentBL) return [];
  return currentManifestData.container_bl
    .filter(c => c.bl_no === currentBL.bl_no)
    .map(c => c.container_no);
}

// ── Renderiza la sección de carga según cantidad de contenedores ──
function renderCargoItems() {
  const section = document.getElementById('cargo-section');
  if (!section) return;
  const cnos = blContainers();
  const multi = cnos.length > 1;

  if (multi) {
    renderCargoMulti(section, cnos);
  } else {
    renderCargoSingle(section);
  }
}

// ── Un solo contenedor (o sin contenedor): lista de items libre ──
function renderCargoSingle(section) {
  const items = currentCargoItems;
  const badge = items.length
    ? `<span style="padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;background:var(--accent-bg);color:var(--accent);border:1px solid #aac8f0">${items.length} item${items.length>1?'s':''}</span>`
    : '';
  section.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px">Items de carga</span>
      ${badge}
      <span style="font-size:10px;color:var(--text3);flex:1">Si hay items, reemplazan la descripción general en el TXT</span>
      <button class="btn sm accent" onclick="openAddCargoItem(null)">+ Agregar item</button>
    </div>
    <div id="ci-single-list" style="display:flex;flex-direction:column;gap:6px">
      ${items.length
        ? items.map(item => ciSingleRow(item)).join('')

// ── Múltiples contenedores: una sección colapsable por contenedor ──
function renderCargoMulti(section, cnos) {
  const itemsByCno = {};
  cnos.forEach(c => { itemsByCno[c] = []; });
  currentCargoItems.forEach(item => {
    const key = item.container_no || '';
    if (key && itemsByCno[key] !== undefined) itemsByCno[key].push(item);
    else if (!key) cnos.forEach(c => itemsByCno[c].push({...item, _shared:true}));
  });

  const totalItems = currentCargoItems.length;
  const allSet = cnos.every(c => itemsByCno[c].some(i => !i._shared));

  section.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px">Carga por contenedor</span>
      ${totalItems ? `<span style="padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;background:var(--accent-bg);color:var(--accent);border:1px solid #aac8f0">${totalItems} item${totalItems>1?'s':''}</span>` : ''}
      <span style="font-size:10px;color:var(--text3);flex:1">Cada contenedor puede tener descripción, peso y código distintos</span>
      ${!allSet ? `<button class="btn sm" onclick="initCargoPerContainer()" title="Crear un item inicial por contenedor con los datos del B/L">⚡ Inicializar por contenedor</button>` : ''}
    </div>
    ${cnos.map(cno => ciContainerBlock(cno, itemsByCno[cno]||[])).join('')}`;
}

    <tr>
      <td style="padding:5px 8px;vertical-align:top">
        <textarea data-ci-field="goods_name" data-ci-id="${item.id}" rows="2"
          style="width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;resize:vertical;min-width:200px"
          onchange="saveCargoField(${item.id},'goods_name',this.value)">${esc(item.goods_name)}</textarea>

          onchange="saveCargoField(${item.id},'gross_weight',this.value)"/>
      </td>
      <td style="padding:5px 8px">
        <input type="text" value="${esc(item.hacienda_item_code||'')}" placeholder="código"
          style="width:120px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:monospace"
          onchange="saveCargoField(${item.id},'hacienda_item_code',this.value)"/>
      </td>
      <td style="padding:5px 8px">
        <select style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px"
          onchange="saveCargoField(${item.id},'hacienda_tariff',this.value)">
          <option value="">—</option>

  return `<div style="border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden">
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border-bottom:1px solid var(--border)">
      ${statusDot}
      <span style="font-family:monospace;font-size:12px;font-weight:700;color:var(--accent)">${esc(cno)}</span>
      <span style="font-size:10px;color:var(--text3);flex:1">${hasOwn ? items.filter(i=>!i._shared).length+' item(s) propios' : 'usando descripción general del B/L'}</span>
      <button class="btn sm accent" onclick="openAddCargoItem('${esc(cno)}')">+ Item</button>
    </div>
    ${rows ? `<table style="width:100%;border-collapse:collapse">

// Guardar campo individual sin recargar todo el bloque
async function saveCargoField(id, field, value) {
  await fetch(`/api/bl-cargo-items/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ [field]: value })
  });
  // Actualizar cache local sin re-render completo
  const item = currentCargoItems.find(i=>i.id===id);
  if (item) item[field] = value;
}

// Inicializar un item por contenedor con los datos del BL
async function initCargoPerContainer() {
  const cnos = blContainers();
  const bl = currentBL;
  const existing = new Set(currentCargoItems.map(i=>i.container_no));
  const toCreate = cnos.filter(c => !existing.has(c));
  if (!toCreate.length) { toast('Todos los contenedores ya tienen items'); return; }
  for (const cno of toCreate) {
    await fetch(`/api/bl/${bl.id}/cargo-items`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        container_no: cno,
        goods_name: bl.goods_name || '',
        gross_weight: bl.gross_weight || 0,
        hacienda_item_code: bl.hacienda_item_code || '',
        hacienda_tariff: bl.hacienda_tariff || '',
      })
    });
  }
  await loadCargoItems(bl.id);
  toast(`${toCreate.length} item${toCreate.length>1?'s':''} inicializado${toCreate.length>1?'s':''}`);
}

function onDockingChange(val) {

  updateManifest('docking_number', clean);
  const inp = document.getElementById('f-docking');
  if (inp) {
    inp.style.borderColor = clean ? '' : '#e6a840';
    inp.style.background  = clean ? '' : '#fffcf2';
  }
  if (currentManifestData) currentManifestData.manifest.docking_number = clean;
}

function onTariffChange(val) {
  updateBL('hacienda_tariff', val);
  const fobInp  = document.getElementById('f-fob');
  const hint    = document.getElementById('tariff-hint');
  const isLibre = val !== '045';
  if (fobInp) {
    fobInp.style.opacity = isLibre ? '0.5' : '';
    fobInp.title = isLibre ? '040 Libre arancel — se fuerza a 0 en el TXT' : '';
  }
  if (hint) hint.textContent = isLibre
    ? 'Libre arancel — valor FOB será 0 en el TXT'
    : 'Aplica arbitrio — incluye valor FOB';
}

function vesselImo(code){

}
function onVesselChange(code){
  const v=catalogVessels.find(v=>v.code===code);

  updateManifest('vessel_code', code);
  updateManifest('vessel_name', v.name);
  updateManifest('imo',         v.imo);

async function suggestItemCode(desc){
  if(!desc||desc.length<5) return;
  const code=document.getElementById('f-item-code');
  if(code && code.value) return; // ya tiene código, no sugerir
  try{
    const items=await api(`/api/catalogs/items/suggest?desc=${encodeURIComponent(desc)}`);
    if(!items.length) return;
    const area=document.getElementById('suggest-area');
    if(!area) return;
    area.style.display='block';
    area.innerHTML=`
      <div class="suggest-box">
        <i class="ti ti-bulb"></i>
        <div class="suggest-content">
          <div class="suggest-title">Códigos sugeridos para: <i>"${esc(desc.substring(0,60))}"</i></div>
          <div class="suggest-items">
            ${items.slice(0,6).map(it=>
              `<div class="suggest-chip" onclick="selectItem('${esc(it.code)}','${esc(it.description)}')">
                <span class="sc-code">${esc(it.code)}</span>
                <span>${esc(it.description.substring(0,35))}${it.description.length>35?'…':''}</span>

}

  const inp=document.getElementById('f-client-ss');
  if(inp){
    inp.value=ss;
    inp.closest('.field').className='field f-ok ac-wrap';
  }
  document.getElementById('client-ac').style.display='none';
  updateBL('hacienda_client_ss', ss);
  // Auto-rellenar IVU si viene del catálogo y el campo está vacío
  if(ivu){
    const ivuInp=document.getElementById('f-client-ivu');
    if(ivuInp && !ivuInp.value){ ivuInp.value=ivu; updateBL('hacienda_client_ivu',ivu); }
  }
  // Mostrar nombre debajo del campo
  let hint = document.getElementById('client-name-hint');
  if(!hint){
    hint = document.createElement('div');
    hint.id = 'client-name-hint';
    hint.className = 'hint';
    inp?.closest('.field')?.appendChild(hint);

  const editBtn = document.createElement('button');

  editBtn.onclick = () => openEditClient(clientId||0, ss, name);
  hint.innerHTML = `<i class="ti ti-check" style="color:var(--success)"></i> ${esc(name)} `;
  hint.appendChild(editBtn);
}

function validateSSField(inp){
  const digits = inp.value.replace(/[^0-9]/g,'');
  const hint   = document.getElementById('nc-ss-hint');
  if(!hint) return;
  if(digits.length === 9){
    hint.innerHTML = `<span style="color:var(--success)">✓ 9 dígitos — formato correcto</span>`;
  } else if(digits.length > 0){
    hint.textContent = `${digits.length}/9 dígitos`;
    hint.style.color = 'var(--warn)';
  } else {
    hint.textContent = '';
  }
}

async function saveNewClient(skipDupCheck){
  const name  = document.getElementById('nc-name')?.value?.trim();
  const ss    = document.getElementById('nc-ss')?.value?.replace(/[^0-9]/g,'').substring(0,9);
  const ivu   = document.getElementById('nc-ivu')?.value?.trim()||'';

// Navegación con teclado en los autocompletes
function acKeydown(e, acId){
  const ac=document.getElementById(acId);
  if(!ac||ac.style.display==='none') return;
  const items=ac.querySelectorAll('.ac-item');
  const focused=ac.querySelector('.ac-item.focused');
  let idx=focused?parseInt(focused.dataset.idx||0):(-1);
  if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1,items.length-1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1,0); }
  else if(e.key==='Enter' && focused){ e.preventDefault(); focused.click(); return; }
  else if(e.key==='Escape'){ ac.style.display='none'; return; }
  items.forEach(el=>el.classList.remove('focused'));
  if(items[idx]) items[idx].classList.add('focused');
}

// Posicionar dropdown fixed bajo el input (evita clipping de overflow:hidden en cards)
function positionDrop(inputEl, dropEl){
  const r = inputEl.getBoundingClientRect();
  dropEl.style.top    = `${r.bottom + 2}px`;
  dropEl.style.left   = `${r.left}px`;
  dropEl.style.width  = `${r.width}px`;
  dropEl.style.display= 'block';
}

// Cerrar dropdowns al hacer clic fuera
document.addEventListener('click',e=>{
  if(!e.target.closest('.ac-wrap'))
    document.querySelectorAll('.ac-drop').forEach(el=>el.style.display='none');
});

// Reposicionar dropdowns visibles al hacer scroll (evita que queden flotando)
document.getElementById('editor')?.addEventListener('scroll', ()=>{
  document.querySelectorAll('.ac-drop').forEach(drop=>{
    if(drop.style.display==='none') return;
    const wrap = drop.closest('.ac-wrap');
    const inp  = wrap?.querySelector('input');
    if(inp) positionDrop(inp, drop);
  });
}, { passive: true });

async function pushSiscommate(){
  if(!currentManifestId){ toast('Selecciona un manifiesto','err'); return; }

  // Verificar que el bridge está online
  try{
    const bst=await api('/api/bridge/status');
    if(!bst.online) throw new Error('offline');
  }catch(e){
    showModal('⚠️ Bridge offline',
      `<p>SiscommateBridge.exe no está corriendo en el servidor.</p>
       <p style="margin-top:8px;font-size:11px;color:var(--text2)">
         Para activarlo, ve a la carpeta <code>bridge/</code> en el servidor
         y ejecuta <code>iniciar_manual.bat</code> o instálalo como servicio con
         <code>instalar_servicio.bat</code>.
       </p>`,
      [{label:'Entendido', action:'closeModal()', cls:'accent'}]);
    return;
  }

  // Verificar campos mínimos
  const m=currentManifestData.manifest;
  if(!m.vessel_name){ toast('Selecciona el buque antes de guardar en SISCOMMATE','err'); return; }

  const blsSinCodigo=currentManifestData.bls.filter(b=>!b.hacienda_client_ss&&!b.consignee_document_no);
  if(blsSinCodigo.length){
    showModal('⚠️ B/L sin SS/EIN',
      `<p>${blsSinCodigo.length} B/L no tienen SS/EIN del consignatario:</p>
       <ul style="margin:8px 0 0 16px;font-size:12px">${blsSinCodigo.map(b=>`<li>${b.bl_no}</li>`).join('')}</ul>
       <p style="margin-top:8px;font-size:11px;color:var(--text2)">¿Deseas continuar igualmente?</p>`,
      [{label:'Cancelar', action:'closeModal()', cls:''},
       {label:'Continuar', action:`confirmPush()`, cls:'purple'}]);
    return;
  }

  await confirmPush();
}

async function confirmPush(){
  closeModal();
  const btn=document.getElementById('btn-push');
  btn.disabled=true;
  btn.innerHTML='<i class="ti ti-loader spin"></i> Guardando...';
  setStatus('Enviando al SISCOMMATE...');
  try{
    const result=await api(`/api/manifests/${currentManifestId}/push-siscommate`,{method:'POST'});
    toast(`Guardado en SISCOMMATE — Lote ${result.lote_nuevo}`);
    setStatus(`Guardado en SISCOMMATE. Lote anterior: ${result.lote_anterior} → nuevo: ${result.lote_nuevo}`);
    // Refrescar estado: recargar manifiesto completo para que el editor refleje el nuevo status
    await loadManifests();
    if(currentManifestId) await selectManifest(currentManifestId);
  }catch(e){
    toast('Error: '+e.message,'err');
    setStatus('Error al guardar en SISCOMMATE');
  }
  btn.disabled=false;
  btn.innerHTML='<i class="ti ti-database-import"></i> Guardar en SISCOMMATE';
}

// ═══════════════════════════════════════════════════════════════
// EXPORTAR TXT HACIENDA
// ═══════════════════════════════════════════════════════════════
async function exportTxt(){
  if(!currentManifestId){ toast('Selecciona un manifiesto','err'); return; }
  const m=currentManifestData.manifest;
  if(!m.manifest_no){
    toast('Ingresa el número de manifiesto Hacienda antes de exportar','err');
    document.querySelector('[onchange*="manifest_no"]')?.focus();
    return;
  }
  if(!m.docking_number || !/^\d+$/.test(m.docking_number)){
    toast('El Docking Number es obligatorio y debe ser numérico','err');
    document.getElementById('f-docking')?.focus();
    return;
  }
  // Validar en servidor antes de descargar
  try {
    const check = await fetch(`/api/manifests/${currentManifestId}/export-txt`);
    if (!check.ok) {
      const err = await check.json();
      showModal('⚠️ No se puede exportar',
        `<p style="color:var(--danger);font-weight:600">Corrija los siguientes problemas antes de exportar:</p>
         <ul style="margin:10px 0 0 16px;font-size:12px;line-height:2">
           ${err.error.split(' | ').map(e=>`<li>${e}</li>`).join('')}
         </ul>`,
        [{label:'Entendido', action:'closeModal()', cls:'accent'}]);
      return;
    }
    // Si pasó validación, descargar el blob directamente
    const blob = await check.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${m.manifest_no||m.voyage_no}_HACIENDA.TXT`;
    a.click();
    URL.revokeObjectURL(url);
    toast('TXT Hacienda PR generado correctamente');
    setTimeout(loadStats,1500);
    await loadManifests();
  } catch(e) {
    toast('Error generando TXT: '+e.message,'err');
  }
}

async function uploadXml(input){

  if(!file) return;
  setStatus('Cargando manifiesto...');
  const fd=new FormData();
  fd.append('xml',file);
  try{
    const r=await fetch('/api/manifests/upload',{method:'POST',body:fd});
    const data=await r.json();
    if(!data.ok) throw new Error(data.error);
    toast(`Manifiesto cargado: ${data.bl_count} B/L`);
    await loadManifests();
    selectManifest(data.manifest_id);
  }catch(e){ toast('Error: '+e.message,'err'); setStatus('Error cargando manifiesto'); }
  input.value='';
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  const file=e.dataTransfer.files[0];
  if(!file||!/\.(xml|pdf)$/i.test(file.name)){ toast('Selecciona un archivo .xml o .pdf','err'); return; }
  uploadXml({files:[file]});
}

async function deleteBL(blId){
  closeModal();
  try {
    await api(`/api/bl/${blId}`, {method:'DELETE'});
    toast('B/L eliminado correctamente');
    if(currentManifestId){
      currentManifestData = await api(`/api/manifests/${currentManifestId}`);
      // Actualizar conteo de B/Ls en lista global
      const m = allManifests.find(x => x.id === currentManifestId);
      if(m && currentManifestData.bls) m.bl_count = currentManifestData.bls.length;
      renderManifestList(filteredByTab(allManifests));
      loadStats();

      // Si el B/L eliminado era el que estaba abierto en el editor
      if(currentBL && currentBL.id === blId){
        if(currentManifestData.bls && currentManifestData.bls.length){
          selectBL(currentManifestData.bls[0]);
        } else {
          currentBL = null;
          document.getElementById('btn-preview').disabled = true;
          document.getElementById('editor').innerHTML = `
            <div class="empty-state">
              <i class="ti ti-packages"></i>
              <p style="font-size:15px;color:var(--text2)">Este manifiesto no tiene B/L</p>
            </div>`;
        }
      }
    }
  } catch(e){
    toast('Error eliminando B/L: ' + e.message, 'err');
  }
}


// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
async function init(){
  await loadCatalogs();
  await loadManifests();

  // Auto-abrir el manifiesto más reciente si no hay ninguno seleccionado
  const activeList = filteredByTab(allManifests);
  if(activeList.length && !currentManifestId){
    await selectManifest(activeList[0].id);
    expandedSet.add(activeList[0].id);
    renderManifestList(activeList);
  }
}
init();
</script>
